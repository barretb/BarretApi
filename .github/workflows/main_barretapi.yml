# Builds and deploys the API on the self-hosted runner registered to this repo
# (barretapi-actions-runner, defined in C:\projects\RunBarretRun\compose.yaml).
#
# The runner only picks up jobs while its container is running. A push still
# queues a run if the machine is off, but it expires after ~24h.
#
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - barretapi

env:
  API_PROJECT_PATH: src/BarretApi.Api/BarretApi.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

# SECURITY — DO NOT ADD A pull_request TRIGGER TO THIS JOB.
#
# This repository is public and this workflow runs on a self-hosted runner.
# A pull_request trigger would let anyone who forks the repo execute arbitrary
# code on that runner: a root process, on a home LAN, sharing a Docker host with
# other containers, able to mint Azure tokens through the OIDC federated
# credential below. Both triggers here require write access to the repo, which
# is the only reason a fork cannot start a job today.
#
# If you want PR validation, add a SEPARATE job with runs-on: ubuntu-latest.
# Untrusted code belongs on disposable hosted infrastructure, never on this
# runner. See:
# https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#hardening-for-self-hosted-runners
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and deploy were separate jobs so the publish output could cross
  # between two GitHub-hosted runners as an artifact. Both halves now run on the
  # same machine, so the upload/download round-trip is pure overhead — one job
  # keeps the publish output on disk and hands it straight to the deploy step.
  build_and_deploy:
    runs-on: [self-hosted, Linux, X64, barretapi]
    timeout-minutes: 20
    permissions:
      id-token: write # Required for requesting the OIDC JWT used by azure/login
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore API project
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Build API project
        run: dotnet build ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore

      # --cleanDestinationDir has no dotnet equivalent and the runner workspace
      # persists between runs, so clear stale output rather than publishing over
      # the top of a previous run's files.
      - name: Publish API project
        run: |
          rm -rf "${{ env.PUBLISH_PATH }}"
          dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ECD6B051F2604642B002A9B4EC4C741A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC86E123C3D748C58D70C2AEC73FBCC9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D4F46E6483534A7AB9ED73872E2AD3B3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'barretapi'
          slot-name: 'Production'
          package: ${{ env.PUBLISH_PATH }}
